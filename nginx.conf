# NGINX Configuration for Inkopia Experience (Production)
# Copy this file to /etc/nginx/sites-available/inkopia and symlink to sites-enabled

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com; # Replace with actual domain

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com; # Replace with actual domain

    # SSL Configuration (Let's Encrypt / Certbot typically manages this)
    # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # GZIP Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Root Directory for Static React Files
    # Replace /path/to/project with your actual deployment path (e.g., /var/www/inkopia-experience/dist)
    root /path/to/project/dist;
    index index.html;

    # Serve Static Frontend Files (SPA Routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API Requests to Node.js / PM2
    location /api/ {
        proxy_pass http://127.0.0.1:3000; # Must match PM2 PORT
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
    }

    # Proxy Uploads Directory (if served by Node)
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        # Allow large file uploads
        client_max_body_size 50M;
    }

    # Proxy Auth and other backend routes directly mapped
    location /schemas/ { proxy_pass http://127.0.0.1:3000; }
    location /data/ { proxy_pass http://127.0.0.1:3000; }
    location /auth/ { proxy_pass http://127.0.0.1:3000; }
    location /upload/ { 
        proxy_pass http://127.0.0.1:3000; 
        client_max_body_size 50M;
    }

    # Cache Control for Static Assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
