<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inkopia Concierge</title>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            background-color: #FDFBF7;
        }

        table {
            border-collapse: collapse;
        }

        .button {
            background-color: #1A2F28;
            color: #FDFBF7 !important;
            padding: 18px 45px;
            text-decoration: none;
            font-family: 'Inter', Helvetica, Arial, sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 3px;
            border-radius: 4px;
            text-transform: uppercase;
            display: inline-block;
        }

        @media screen and (max-width: 600px) {
            .main-width {
                width: 100% !important;
            }
        }
    </style>
</head>

<body style="margin: 0; padding: 0; background-color: #FDFBF7;">
    <center>
        <table width="600" border="0" cellpadding="0" cellspacing="0" class="main-width"
            style="background-color: #FDFBF7; margin-top: 30px; margin-bottom: 30px;">
            <!-- MASTER DESIGN IMAGE -->
            <tr>
                <td align="center">
                    <a href="https://inkopia.com" style="text-decoration: none;">
                        <img src="https://i.ibb.co/3mCLyK2G/Whats-App-Image-2026-05-08-at-5-52-44-PM.jpg" width="600"
                            alt="Inkopia Concierge"
                            style="display: block; width: 100%; max-width: 600px; height: auto; border: 0;" />
                    </a>
                </td>
            </tr>

            <!-- SPACING -->
            <tr>
                <td height="40" style="font-size: 1px; line-height: 1px;">&nbsp;</td>
            </tr>

            <!-- REAL HTML BUTTON -->
            <tr>
                <td align="center">
                    <!-- REPLACE THE LINK BELOW WITH YOUR ACTUAL BOOKING LINK -->
                    <a href="https://inkopia.com" class="button">Book Your Session</a>
                </td>
            </tr>

            <!-- FOOTER SPACING -->
            <tr>
                <td height="60" style="font-size: 1px; line-height: 1px;">&nbsp;</td>
            </tr>

            <!-- TEXT FOOTER (For Spam Filters) -->
            <tr>
                <td align="center"
                    style="font-family: Arial, sans-serif; font-size: 11px; color: #1A2F28; opacity: 0.5; letter-spacing: 2px; text-transform: uppercase;">
                    INKOPIA © 2026
                </td>
            </tr>
        </table>
    </center>
</body>

</html>
