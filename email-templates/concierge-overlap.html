<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml"
    xmlns:o="urn:schemas-microsoft-com:office:office">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inkopia Concierge</title>
    <!--[if gte mso 9]>
    <xml>
      <o:OfficeDocumentSettings>
        <o:AllowPNG/>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
    <![endif]-->
    <style type="text/css">
        body,
        table,
        td,
        a {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }

        img {
            -ms-interpolation-mode: bicubic;
            border: 0;
            height: auto;
            line-height: 100%;
            outline: none;
            text-decoration: none;
        }

        .button {
            background-color: #1A2F28;
            color: #FDFBF7 !important;
            padding: 18px 45px;
            text-decoration: none;
            font-family: 'Inter', Helvetica, Arial, sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 3px;
            border-radius: 4px;
            text-transform: uppercase;
            display: inline-block;
        }

        @media screen and (max-width: 600px) {
            .main-width {
                width: 100% !important;
            }
        }
    </style>
</head>

<body style="margin: 0; padding: 0; background-color: #FDFBF7;">
    <center>
        <!-- MASTER CONTAINER WITH BACKGROUND IMAGE -->
        <table width="600" border="0" cellpadding="0" cellspacing="0" class="main-width">
            <tr>
                <td background="https://i.ibb.co/3mCLyK2G/Whats-App-Image-2026-05-08-at-5-52-44-PM.jpg" bgcolor="#FDFBF7"
                    width="600" valign="top" style="background-position: top center; background-repeat: no-repeat; background-size: cover;">
                    <!--[if gte mso 9]>
                    <v:rect xmlns:v="urn:schemas-microsoft-com:vml" fill="true" stroke="false" style="width:600px;height:1200px;">
                      <v:fill type="tile" src="https://i.ibb.co/3mCLyK2G/Whats-App-Image-2026-05-08-at-5-52-44-PM.jpg" color="#FDFBF7" />
                      <v:textbox inset="0,0,0,0">
                    <![endif]-->
                    <div>
                        <!-- VERTICAL SPACING TO POSITION THE BUTTON AT THE BOTTOM -->
                        <table width="100%" border="0" cellpadding="0" cellspacing="0">
                            <tr>
                                <td height="1000" style="font-size: 1px; line-height: 1px;">&nbsp;</td>
                            </tr>
                            <tr>
                                <td align="center" style="padding-bottom: 60px;">
                                    <!-- OVERLAPPING BUTTON -->
                                    <a href="https://inkopia.com" class="button">Book Your Session</a>
                                </td>
                            </tr>
                        </table>
                    </div>
                    <!--[if gte mso 9]>
                      </v:textbox>
                    </v:rect>
                    <![endif]-->
                </td>
            </tr>
        </table>

        <!-- FOOTER -->
        <table width="600" border="0" cellpadding="0" cellspacing="0" class="main-width">
            <tr>
                <td align="center"
                    style="padding: 40px 0; font-family: Arial, sans-serif; font-size: 11px; color: #1A2F28; opacity: 0.5; letter-spacing: 2px; text-transform: uppercase;">
                    INKOPIA © 2026
                </td>
            </tr>
        </table>
    </center>
</body>

</html>
