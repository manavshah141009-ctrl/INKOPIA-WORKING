<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inkopia Concierge</title>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            background-color: #FDFBF7;
        }

        table {
            border-collapse: collapse;
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
        }

        td {
            padding: 0;
        }

        img {
            border: 0;
            display: block;
            height: auto;
            line-height: 100%;
            outline: none;
            text-decoration: none;
        }

        @media screen and (max-width: 600px) {
            .main-width {
                width: 100% !important;
            }
        }
    </style>
</head>

<body style="margin: 0; padding: 0; background-color: #FDFBF7;">
    <center>
        <!-- MASTER SEAMLESS TABLE -->
        <table width="600" border="0" cellpadding="0" cellspacing="0" class="main-width" style="margin: 30px auto;">

            <!-- TOP SECTION (NON-CLICKABLE) -->
            <tr>
                <td align="center">
                    <!-- VERIFIED WORKING LINK -->
                    <img src="https://i.ibb.co/4Z88YzVj/Chat-GPT-Image-May-11-2026-03-30-17-PM.png" width="600"
                        alt="Inkopia Concierge" style="width: 100%; max-width: 600px; display: block;" />
                </td>
            </tr>

            <!-- BOTTOM SECTION (CLICKABLE BUTTON & TAGLINE) -->
            <tr>
                <td align="center">
                    <!-- YOUR BOOKING REDIRECT URL -->
                    <a href="https://inkopia.com" style="text-decoration: none; border: 0;">
                        <!-- VERIFIED WORKING LINK (4Z88YzVj) -->
                        <img src="https://i.ibb.co/4Z88YzVj/Chat-GPT-Image-May-11-2026-03-30-17-PM.png" width="600"
                            alt="Book Your Session" style="width: 100%; max-width: 600px; display: block;" />
                    </a>
                </td>
            </tr>

            <!-- FOOTER SPACING & TRADEMARK -->
            <tr>
                <td align="center"
                    style="padding: 40px 0; font-family: Arial, sans-serif; font-size: 10px; color: #1A2F28; opacity: 0.4; letter-spacing: 2px; text-transform: uppercase;">
                    INKOPIA © 2026
                </td>
            </tr>

        </table>
    </center>
</body>

</html>
